name = "PEEK Spacers"
description = "Spacers defining the anode gap."

[[subsystems]]
key = "pcb_segments"
id = "005"
name = "PCB Anode Segments"
description = "Segment-level PCB batches used to build anodes."

[[subsystems]]
key = "adapter_boards"
id = "006"
name = "Adapter Boards"
description = "Signal and HV bias adapter boards."

[[subsystems]]
key = "edge_connectors"
id = "007"
name = "Edge Connector Boards"
description = "Boards linking strips from anodes to adapter boards."

[[subsystems]]
key = "composite_frames"
id = "008"
name = "Composite Frames"
description = "Mechanical structures supporting the CRU assembly."

[[subsystems]]
key = "bias_filtering"
id = "009"
name = "Cold Bias Filter Boards"
description = "HV filtering hardware mounted in the composite frame."

[[subsystems]]
key = "bias_cabling"
id = "010"
name = "Cold Bias HV Cables"
description = "HV bundle jumpers between filter boxes."

[[subsystems]]
key = "decoupling"
id = "021"
name = "Decoupling Devices"
description = "Suspension and alignment hardware."

[[subsystems]]
key = "level_meter"
id = "031"
name = "Level Meters"
description = "Level meter devices, cable bundles, and readout boards."

[[subsystems]]
key = "shipping"
id = "051"
name = "Shipping"
description = "Transport boxes and shipping containers."

[[subsystems]]
key = "signal_cabling"
id = "011"
name = "Signal Cable"
description = "Flat signal cables covered by the CRP interface document and June 2026 PID table."

[[subsystems]]
key = "cable_trays"
id = "012"
name = "Cable Tray"
description = "Pre-assembled cable trays connecting pairs of chimneys."

[[subsystems]]
key = "installation_tooling"
id = "041"
name = "Installation Tooling"
description = "Tooling used to assemble CRPs and superstructures in the cryostat."

