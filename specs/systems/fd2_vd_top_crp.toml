  data_type = "text"
  description = "Unique CRU identifier."

  [[components.artifacts]]
  name = "qc_executive_summary"
  artifact_type = "qc_summary"
  description = "CRP signoff summary once defined."

[[components]]
key = "cru_anode_panel"
subsystem = "anode_panels"
name = "CRU Anode Panel"
category = "hardware"
description = "Collection and shield anode panel family."
notes = "The June 2026 PID table lists collection-induction two-layer and shield-induction one-layer variants."

[[components]]
key = "peek_spacer"
subsystem = "spacers"
name = "PEEK Spacer"
category = "batch"
