[system]
key = "fd2_vd_top_crp"
name = "FD2-VD Top Charge Readout Planes"
short_name = "Top CRP"
detector = "FD2-VD"
pid_prefix = "055"
description = "Top CRP mechanical and cable hierarchy for the vertical drift detector."
source_document = "3402888_DID_HWDB_TOP_CRP_March08_2026.docx"
notes = "Updated from the March 2026 CRP interface document and HWDB_FD-VD_CRP_PIDtable_2June2026.xlsx. Signal cables and cable trays are kept in this model even though the interface document also describes them as System ID 052 instrumented-CRP scope."

[[subsystems]]
key = "complete_crp"
id = "001"
name = "Instrumented CRP / Complete CRP"
description = "Top-level instrumented CRP assembly composed of two CRUs."

[[subsystems]]
key = "half_crp"
id = "002"
name = "Half CRP / CRU"
description = "Minimal assembly unit commonly referred to as a CRU."

[[subsystems]]
key = "anode_panels"
id = "003"
name = "CRU Anode Panels"
description = "Collection and shield anode panels."

[[subsystems]]
