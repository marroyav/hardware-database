  data_type = "text"
  description = "Production batch identifier."

[[components]]
key = "pcb_anode_segment"
subsystem = "pcb_segments"
name = "PCB Anode Segment"
category = "batch"
is_batch = true
description = "Production batch of PCB segments used in the anode build."
notes = "The June 2026 PID table lists collection, shield, induction 1, and induction 2 batches; the interface document still cites a larger PCB variant set."

[[components]]
key = "adapter_board"
subsystem = "adapter_boards"
