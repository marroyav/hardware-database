[system]
key = "fd2_vd_overview"
name = "FD2-VD Detector Overview"
short_name = "FD2-VD Overview"
detector = "FD2-VD"
description = "Top-level system and interface view derived from the FD-VD hierarchy deck."
source_document = "HWDB_FD-VD_hierarchy.pptx"
notes = "This seed captures detector-level structure and dependencies. It is intentionally coarser than the consortium-specific system specs."

[[components]]
key = "fd2_vd_detector"
name = "FD2-VD Complete Detector"
category = "hardware"
description = "Top-level detector node used for overview graphs."

[[components]]
key = "vd_superstructure"
name = "Superstructure (SST)"
category = "hardware"
description = "Support structure carrying CRPs and related instrumentation."

[[components]]
key = "vd_crp"
name = "Top CRP"
category = "hardware"
description = "Charge readout planes and their mechanical hierarchy."

[[components]]
key = "vd_tde"
name = "TDE"
category = "electronics"
description = "Top drift electronics, SGFT chimneys, uTCA crates, timing, and support systems."

[[components]]
key = "vd_bde"
name = "BDE"
category = "electronics"
description = "Bottom drift electronics and readout chain."

[[components]]
key = "vd_pds_cathode"
name = "PDS Cathode Modules"
category = "electronics"
description = "Cathode-mounted photon detection system path."

[[components]]
key = "vd_pds_membrane"
name = "PDS Membrane Modules"
category = "electronics"
description = "Membrane-mounted photon detection system path."

[[components]]
key = "vd_hv_cathode"
