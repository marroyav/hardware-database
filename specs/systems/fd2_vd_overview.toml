description = "Cathode plane, suspension, and interconnect system."

[[components]]
key = "vd_field_cage"
name = "Field Cage"
category = "hardware"
description = "Field cage super modules and terminations."

[[components]]
key = "vd_ci"
name = "Cryogenic Instrumentation"
